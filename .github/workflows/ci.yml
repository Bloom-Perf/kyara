name: Kyara CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  image:
    # Builds the Docker image, then runs one scenario in each browser it ships
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kyara:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          size=$(docker image inspect kyara:ci --format '{{.Size}}' | numfmt --to=si)
          echo "Image size: ${size}B" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (Firefox and Chrome)
        # Batch mode (hikaku): exits with code 1 if a scenario fails
        run: |
          docker run --rm --shm-size=1g \
            -v "$PWD/.github/docker-smoke-test.yaml:/var/config/kyara.yaml:ro" \
            -e KYARA_HIKAKU_BASELINE_PATH=/tmp/baseline.json \
            -e KYARA_HIKAKU_UPDATE_BASELINE=true \
            kyara:ci
