apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kyara.fullname" . }}-scenarios
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kyara.labels" . | nindent 4 }}
data:
  {{- if .Values.scenarios }}
  {{- toYaml .Values.scenarios | nindent 2 }}
  {{- else }}
  {{- (.Files.Glob "config/*").AsConfig | nindent 2 }}
  {{- end }}
